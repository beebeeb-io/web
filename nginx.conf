# ── Office bundle Brotli negotiation (task 1567 hosting) ──────────────────
#
# nginx:1.27-alpine (this image's runtime base) ships NO ngx_brotli module —
# confirmed directly: `docker run --rm nginx:1.27-alpine nginx -V 2>&1 | grep
# brotli` matches nothing, so `brotli_static on;` is not available. Two ways
# to still serve the scripts/office-bundle-stage.sh-produced .br siblings
# with the right Content-Encoding: (a) compile a custom nginx image with
# ngx_brotli statically linked, or (b) hand-negotiate Accept-Encoding against
# the precompressed files already sitting next to the originals. Chose (b):
# it adds no new build stage and no third-party nginx-module source tree to
# re-pin on every base-image bump (ngx_brotli's own build vendors a nested
# google/brotli submodule — two more supply-chain pins to track, for a need
# that is exactly 10 known files under one versioned directory, not
# site-wide brotli where a maintained module would earn its complexity).
#
# The two maps below key off the SAME $http_accept_encoding check but
# produce different values on purpose: $office_br_suffix is a literal path
# suffix for try_files (".br" or ""), $office_br_encoding is the header
# TOKEN ("br" or ""). nginx omits an add_header whose value is an empty
# string entirely (documented behavior), so add_header Content-Encoding
# $office_br_encoding never sends a bogus empty header, and never claims
# Content-Encoding: br for a client that didn't ask for it. The other half
# of correctness — never claiming br for a file whose .br sibling doesn't
# exist — is a BUILD-TIME invariant, not a request-time check:
# office-bundle-stage.sh refuses to stage a bundle where any asset lacks a
# .br sibling, so by the time this config is serving a real request, the
# sibling this decides to reach for is always there.
map $http_accept_encoding $office_br_suffix {
    default    "";
    "~*\bbr\b" ".br";
}
map $http_accept_encoding $office_br_encoding {
    default    "";
    "~*\bbr\b" "br";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version from Server: header
    server_tokens off;

    # Security headers — applied to all responses via `always`. Note nginx's
    # add_header inheritance: locations with their own add_header (cache, AASA)
    # do NOT inherit these. The SPA fallback location / has no add_header of
    # its own, so it inherits these — which is where they matter most.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' blob: https://api.beebeeb.io wss://api.beebeeb.io https://status.beebeeb.io https://errors.beebeeb.io; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Cross-Origin-Embedder-Policy + Cross-Origin-Resource-Policy — permissive
    # defaults so the isolated /office/:fileId document (COEP: require-corp,
    # below) can construct the APP'S OWN pre-existing crypto worker (needed
    # to decrypt the very file being opened) from assets served by the
    # generic hashed-asset location further down. Root-caused by actually
    # running the office e2e spec against the real engine and capturing the
    # raw CDP blockedReason: `coep-frame-resource-needs-coep-header`. Per the
    # HTML spec, a dedicated Worker's global has its OWN embedder policy,
    # inherited from ITS OWN response headers — a same-origin script and a
    # CORP header alone are NOT enough; the worker script's response must
    # ALSO carry Cross-Origin-Embedder-Policy itself, or a COEP:require-corp
    # creator refuses to construct it (an earlier attempt at this fix added
    # only CORP — confirmed insufficient by re-running against the real
    # engine and seeing the identical block). The failure is a silent hang:
    # WasmGuard never sees crypto go ready, nothing renders, no console
    # exception. Neither header touches outbound requests, so neither
    # weakens zero-egress (docs/EGRESS.md). vite.config.ts's
    # officeIsolationHeadersPlugin carries the identical fix (and citation)
    # for `bun dev`.
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Gzip — Vite output is compressible
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff2
        application/octet-stream
        image/x-icon;
    # application/octet-stream + image/x-icon were added for the office
    # bundle's .data and .ico (task 1567), meant as a gzip-on-the-fly
    # fallback for clients without Brotli. text/html needs no entry — nginx
    # always gzips it regardless of gzip_types.
    #
    # Task 1584 (prod, iPhone Safari): the /office/<version>/ locations below
    # now say `gzip off`. With gzip on there, nginx gzipped the ALREADY-Brotli
    # .br body a second time and sent BOTH `Content-Encoding: br` and
    # `Content-Encoding: gzip` (it does not know that add_header set an
    # encoding). Chromium decodes that stack; WebKit does not ("cannot decode
    # raw data" in Playwright WebKit; on the iPhone the engine document
    # bb-office-host.html showed its Brotli bytes as text and the editor sat
    # at "Preparing the editor…"). A client that does not send br now gets the
    # identity file. Every browser that can run the engine at all (it needs
    # cross-origin isolation: Safari 15.2+, current Chrome/Firefox) sends br
    # over HTTPS, and gzipping a 172 MB wasm per request was a CPU cost anyway.
    # Guarded by test/1584-nginx-office-encoding.test.ts.

    # ── Office editor bundle (task 1567) — route-scoped cross-origin isolation ──
    #
    # LibreOffice-WASM needs `crossOriginIsolated === true` for SharedArrayBuffer
    # (its pthread build uses -sPROXY_TO_PTHREAD=1 — repos/office/docs/PHASE2-RESULTS.md).
    # That requires BOTH Cross-Origin-Opener-Policy: same-origin AND
    # Cross-Origin-Embedder-Policy on every response the isolated document loads —
    # COOP/COEP are NOT scoped by CSP; they are per-response headers. Applying them
    # server-wide would break any future cross-origin embed (Stripe, etc.) elsewhere
    # in the app, so they are added ONLY under /office/, never in the site-wide
    # headers above or in the SPA-fallback location below.
    #
    # COEP value chosen: `require-corp`, not `credentialless`. Every resource this
    # route loads is same-origin already — zero network egress is a hard product
    # constraint (docs/EGRESS.md) — so `require-corp`'s stricter "same-origin or
    # explicit CORP" rule costs nothing here, and it has the widest, longest-shipped
    # browser support (no reliance on `credentialless`, which some engines still
    # implement more recently/unevenly). `Cross-Origin-Resource-Policy: same-origin`
    # is added too, as defense-in-depth: even if something outside this isolated
    # route ever tried to embed these responses, CORP blocks it independent of COEP.
    #
    # Regex office locations are declared BEFORE the generic hashed-asset location
    # below so they win nginx's "first matching regex location in file order" rule
    # for any /office/... URL — the generic block is otherwise untouched.

    # manifest.json — the small, MUTABLE pointer to the current bundle version.
    # Never cached (mirrors index.html / wasm-sri.json further down): a stale
    # cached manifest would keep serving an old bundle version indefinitely.
    location = /office/manifest.json {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Content-hashed bundle files under /office/<version>/... (including the
    # nested bridge/bb-office-worker.js — the engine's own baked-in
    # importScripts() call needs that exact relative path, see
    # office-dev-assets.sh) — immutable forever, same guarantee as the
    # generic hashed-asset location, plus isolation headers, plus the Brotli
    # negotiation explained above the $office_br_* maps at the top of this
    # file.
    #
    # One location per real extension, not one combined regex: `default_type`
    # takes a literal MIME type, not a variable (checked — it is a plain
    # string slot in nginx core), and the served file's own extension is
    # ALWAYS `.br` when the negotiation picks the compressed sibling. Without
    # a per-extension literal here, that `.br` suffix would fall through to
    # nginx's generic `application/octet-stream` default for every asset —
    # wrong, and specifically fatal for `soffice.wasm.br`, since
    # `WebAssembly.instantiateStreaming` refuses a response whose
    # Content-Type isn't exactly `application/wasm`.
    location ~* ^/office/[^/]+/.+\.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Encoding $office_br_encoding always;
        gzip off; # task 1584: never gzip the .br body a second time (see the gzip block)
        try_files $uri$office_br_suffix $uri =404;
    }
    location ~* ^/office/[^/]+/.+\.data$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Encoding $office_br_encoding always;
        gzip off; # task 1584: never gzip the .br body a second time (see the gzip block)
        try_files $uri$office_br_suffix $uri =404;
    }
    location ~* ^/office/[^/]+/.+\.metadata$ {
        default_type application/json;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Encoding $office_br_encoding always;
        gzip off; # task 1584: never gzip the .br body a second time (see the gzip block)
        try_files $uri$office_br_suffix $uri =404;
    }
    location ~* ^/office/[^/]+/.+\.js$ {
        default_type application/javascript;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Encoding $office_br_encoding always;
        gzip off; # task 1584: never gzip the .br body a second time (see the gzip block)
        try_files $uri$office_br_suffix $uri =404;
    }
    location ~* ^/office/[^/]+/.+\.html$ {
        default_type text/html;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Encoding $office_br_encoding always;
        gzip off; # task 1584: never gzip the .br body a second time (see the gzip block)
        # Ship prep (task 1567, 2026-09-27): THIS is bb-office-host.html —
        # the actual isolated engine document (office-engine-host.tsx's own
        # iframe target), not the outer /office/:fileId React page (whose
        # CSP is the separate `location /office/` block below, and which
        # legitimately needs api.beebeeb.io/status/errors for the REST of
        # the app's own save/decrypt/telemetry calls). This document talks
        # to that outer page ONLY via postMessage/MessageChannel — it has no
        # legitimate network need at all (docs/EGRESS.md's whole design),
        # so connect-src is 'self' with none of the external hosts the outer
        # page's policy carries. Previously this location set NO
        # Content-Security-Policy header at all (found while auditing the
        # egress design against a security "prove it in the headers, not
        # just in a Playwright request capture" review) — the zero-egress
        # guarantee rested entirely on the code never making those calls
        # plus e2e/1567-office-editor-egress-full.spec.ts's own runtime
        # capture, with no browser-enforced backstop if a future change
        # (ours or an upstream LibreOffice one) ever added one. frame-ancestors
        # is 'self' (not 'none' like the outer page) because this document
        # MUST be embeddable — by our own origin only.
        #
        # script-src carries 'unsafe-inline' (the outer page's own CSP does
        # NOT) — a real, deliberate exception, not an oversight: this exact
        # file (Qt's own qt_soffice.html, office-dev-assets.sh's assembly
        # input, never edited by us) boots via an INLINE <script> block that
        # defines `init()` PLUS an inline `<body onload="init()">` handler —
        # both are how `QtLoader(...).loadEmscriptenModule("soffice")` gets
        # called at all. A first attempt at this CSP without 'unsafe-inline'
        # was caught by the ship-prep gate re-run, not shipped blind: the
        # bridge object still appeared (bb-office-api.js is a separate,
        # non-inline <script src>, so IT still ran) but every document open
        # then hung/failed, because the inline script defining `init` was
        # silently blocked — confirmed via a direct console capture showing
        # "Executing inline script violates ... script-src" for exactly that
        # block, and a second, identical CSP violation for the inline
        # `onload` attribute (hashing the script would not have been enough
        # on its own — CSP hashes don't cover inline EVENT HANDLERS unless
        # 'unsafe-hashes' is also present, per the browser's own console
        # message). Judged an acceptable, narrow exception rather than
        # patching the vendored HTML or adding a hash+'unsafe-hashes' pair
        # that would break on the next Legion rebuild's whitespace: this
        # page is our own static, integrity-pinned build artifact, never
        # reflects user input, and the property this CSP actually exists to
        # guarantee — zero egress — lives entirely in connect-src, which
        # stays strict 'self' with no exception.
        #
        # script-src ALSO carries plain 'unsafe-eval', not just
        # 'wasm-unsafe-eval' — found the SAME way as the 'unsafe-inline' gap
        # above (a real gate failure, not inspection): with 'unsafe-inline'
        # alone, `init()` ran and pthread workers WERE created, but every
        # `open()` call timed out with "Module.uno_main never appeared
        # within 60000ms". A direct probe showed the engine's own
        # `#qtstatus` element (its own boot-progress UI, not just a console
        # line) displaying "EvalError: Evaluating a string as JavaScript
        # violates ... 'unsafe-eval' is not an allowed source" — Emscripten's
        # generated glue (qtloader.js/soffice.js, both vendored, never edited
        # by us) calls plain `eval()` somewhere in its own bootstrap, which
        # 'wasm-unsafe-eval' (WebAssembly.instantiate only) does not cover.
        # Re-verified after adding it: pthread workers created, the full
        # LibreOffice boot sequence runs (configmgr, VCL, etc.), and
        # `bbOffice.open()` reaches real UNO code (confirmed by feeding it
        # deliberately invalid bytes and getting LibreOffice's own
        # `loadComponentFromURL returned null ... filter MS Word 2007 XML`
        # error, not a timeout) — the SAME "our own static artifact, not
        # user-influenced, connect-src is the property that matters" judgment
        # as the 'unsafe-inline' exception above applies here too.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; media-src 'self' blob:; frame-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        try_files $uri$office_br_suffix $uri =404;
    }
    location ~* ^/office/[^/]+/.+\.svg$ {
        default_type image/svg+xml;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Encoding $office_br_encoding always;
        gzip off; # task 1584: never gzip the .br body a second time (see the gzip block)
        try_files $uri$office_br_suffix $uri =404;
    }
    location ~* ^/office/[^/]+/.+\.ico$ {
        default_type image/x-icon;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Encoding $office_br_encoding always;
        gzip off; # task 1584: never gzip the .br body a second time (see the gzip block)
        try_files $uri$office_br_suffix $uri =404;
    }

    # The office page route itself (e.g. /office/<fileId>) is client-rendered —
    # SPA fallback, same as the top-level `location /` below, but carrying the
    # SAME isolation headers (the entire point of scoping this block to /office/).
    # A plain (non ^~) prefix location: only reached when neither the exact
    # manifest match nor the regex asset match above already claimed the request.
    location /office/ {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' blob: https://api.beebeeb.io wss://api.beebeeb.io https://status.beebeeb.io https://errors.beebeeb.io; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # NOT `try_files $uri $uri/ /index.html`: try_files' last argument is
        # an INTERNAL REDIRECT, so /index.html was re-matched against
        # `location /` and served with THAT block's headers — no COOP, so the
        # page was never crossOriginIsolated, SharedArrayBuffer was missing,
        # and the engine hung at "Preparing the editor" forever ("pthread_create:
        # environment does not support SharedArrayBuffer"). Found 2026-09-27 by
        # running the real amd64 image on the Legion; the vite dev server never
        # had this gap, which is why every dev-server gate was green. `rewrite
        # ... break` stays inside THIS location, so the headers above apply.
        # Every real engine file under /office/ is claimed by the exact/regex
        # locations above before this prefix block is consulted.
        rewrite ^ /index.html break;
    }

    # Hashed Vite output — cache forever.
    #
    # This is where the app's own crypto.worker.ts chunk is actually served
    # from (a hashed /assets/*.js file, same as any other Vite chunk) — the
    # SAME asset the /office/* isolation-header comment above (and
    # vite.config.ts's officeIsolationHeadersPlugin, its dev-server twin)
    # explains needs its OWN Cross-Origin-Embedder-Policy once ANY route in
    # the app is cross-origin-isolated. Found by actually building this image
    # and curling it (task 1567 hosting): this location already declares its
    # own add_header (Cache-Control), so nginx's own non-inheritance rule
    # (documented above the SPA-fallback location below) silently dropped the
    # site-wide COEP/CORP that was only ever added at the server level — the
    # fix those two lines describe never reached a single real response,
    # since every content-serving location here declares its own add_header.
    # Re-declared explicitly, matching vite.config.ts's dev-server behavior
    # exactly (COEP: require-corp, CORP: cross-origin, on every response
    # outside /office/*).
    location ~* \.(js|css|wasm|woff2|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    # Apple Universal Links — AASA must be served as application/json
    location = /.well-known/apple-app-site-association {
        add_header Content-Type "application/json";
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    # Allow .well-known/* (ACME, AASA, etc.) before the dotfiles deny rule
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # SPA fallback — serves index.html and wasm-sri.json (the non-hashed control
    # files). These MUST NOT be cached: a stale index.html / wasm-sri.json keeps
    # an old SRI integrity and blocks WASM load after a deploy (incident
    # 2026-06-30). The hashed assets (js/css/wasm) stay immutable above.
    # nginx add_header does NOT inherit into a location that declares its own
    # add_header, so the security headers are RE-DECLARED here (don't drop
    # them) — including Cross-Origin-Embedder-Policy/-Resource-Policy, which
    # the server-level block above adds for exactly this reason (task 1567
    # hosting: this location's own pre-existing add_header set was silently
    # eating them before this fix — same non-inheritance gap as the generic
    # hashed-asset location above, found the same way, by curling the built
    # image).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' blob: https://api.beebeeb.io wss://api.beebeeb.io https://status.beebeeb.io https://errors.beebeeb.io; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # Block other dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
