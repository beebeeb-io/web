name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun test # unit tests (test/, scoped via bunfig.toml) — 0740b: was never in CI
      - run: bun run test:order # 1590: reversed + shuffled (seed in the log) + each file alone, and no raw mock.module
      - run: bun run build

  claims-guard:
    name: Claims guard
    runs-on: ubuntu-latest
    # Phased rollout (plan 2026-09-06-premortem-05-claims-regression-ci-guard,
    # Task 2 sequencing): web is not yet clean (nginx.conf/src/lib/hibp.ts still
    # reach api.pwnedpasswords.com; provider names; "Unlimited version history";
    # phantom regions in real product copy) — those are plan Tasks 3/4/6/7.
    # Promote to a required gate once `bash scripts/claims-guard/claims-guard.sh`
    # exits 0 here.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run claims guard
        run: bash scripts/claims-guard/claims-guard.sh

  # ── Browser-level regression gate (task 0866) ───────────────────────────────
  # Runs the real Playwright suite against a self-bootstrapped full stack:
  # Postgres 17 (service) + a freshly-built debug `beebeeb-api` + Vite, driven by
  # the SAME `e2e/scripts/web-e2e.sh` harness used locally (per-spec isolation —
  # each spec file gets a fresh DB + blob store, so no spec contaminates another).
  #
  # Wiring detail (the one cross-repo bit): the web client has no server in its
  # own checkout, so this job clones `beebeeb-io/server` (+ its `core` path dep)
  # as siblings INSIDE the workspace and builds the API in DEBUG. Debug is
  # mandatory — `/dev/auto-login` (which global.setup.ts authenticates through)
  # is `#[cfg(debug_assertions)]` and absent from release builds. The server's
  # dev Cargo profile optimizes only the Argon2id crates, so the debug build's
  # crypto is release-fast (the dev auto-login derives a 256 MiB Argon2id key on
  # every page load) without slowing the rest of the debug compile.
  #
  # Task 1534 review round 2 (Codex P1): also clones + builds `beebeeb-io/cli`
  # as a THIRD sibling so e2e/1534-cli-upload-share-decrypt.spec.ts — the only
  # real-stack proof that a non-web client's key derivation matches web's — gets
  # a real `bb` binary instead of silently skipping (it now hard-fails without
  # one; see that spec's own doc comment). Unlike server, `cli` depends on
  # `core` via a pinned GIT dependency (not a local path dep — see its
  # Cargo.toml), so no separate `core` sibling checkout is needed for cli's
  # sake; `cargo build` fetches it straight from GitHub over HTTPS. Both
  # `cli` and `core` are PUBLIC repos (unlike `server`), so this needs no
  # extra checkout credential — the private-repo credential gap noted
  # elsewhere for `server`/`core` access does not apply here.
  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    # informational until e2e test-backend stability under auth load is hardened
    # (task 0869) — promote to required gate after. Still runs + uploads the
    # report artifact on failure, so it gives signal without blocking merges.
    continue-on-error: true
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: beebeeb
          POSTGRES_PASSWORD: beebeeb_dev
          POSTGRES_DB: beebeeb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # web-e2e.sh connects here and CREATEs its own throwaway per-spec DBs.
      E2E_PG_PORT: "5432"
      # Point the harness at the API binary built below (sibling checkout, inside
      # the workspace so Swatinem/rust-cache can cache its target dir).
      E2E_API_BIN: ${{ github.workspace }}/server/target/debug/beebeeb-api
      # Same, for the `bb` binary e2e/1534-cli-upload-share-decrypt.spec.ts needs
      # (task 1534 review round 2) — built below from the `cli` sibling checkout.
      E2E_BB_BIN: ${{ github.workspace }}/cli/target/debug/bb
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout web
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Checkout server (provides the debug API binary)
        run: git clone --depth 1 https://github.com/beebeeb-io/server.git server

      - name: Checkout core (server Cargo path dependency — ../core)
        run: git clone --depth 1 https://github.com/beebeeb-io/core.git core

      - name: Checkout cli (provides the debug bb binary for task 1534's spec)
        run: git clone --depth 1 https://github.com/beebeeb-io/cli.git cli

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action; toolchain set below
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            server
            cli

      - name: Install system deps (mold linker, psql client, lsof)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold postgresql-client lsof

      - name: Build server (debug; Argon2id optimized via server dev profile)
        working-directory: server
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo build -p beebeeb-api

      - name: Build cli (debug bb binary — task 1534's real-stack e2e spec)
        working-directory: cli
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo build -p beebeeb-cli

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E gate (isolated full-stack harness, per-spec backend)
        run: ./e2e/scripts/web-e2e.sh

      - name: Upload Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
