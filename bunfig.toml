# Scope `bun test` to the unit-test directory (task 0740b).
#
# Bun's test runner discovers BOTH `*.test.ts` and `*.spec.ts` everywhere by
# default — so a bare `bun test` tried to execute the Playwright `e2e/*.spec.ts`
# files under bun ("Playwright Test did not expect test() to be called here"),
# producing dozens of bogus failures that buried the real unit tests. The unit
# tests live in `test/`; the e2e specs run via `e2e/scripts/web-e2e.sh` (real
# browsers), never under bun. Rooting test discovery at `test/` keeps a bare
# `bun test` meaningful (and CI-wireable) without touching the e2e suite.
[test]
root = "test"
# Final review P3-2 (web #199): no unit test may reach a production host. The
# preload refuses fetch to beebeeb.io / *.beebeeb.io and fails the test that
# tried it (test/helpers/no-prod-network.ts; its own test proves it goes red).
# LD-0079: test/helpers/wasm-preload.ts MUST stay first. It makes the one
# beebeeb-wasm instance before any module's import-time init() can make a second
# one that replaces it (test/ld-0079-one-wasm-instance.test.ts pins the order).
preload = ["./test/helpers/wasm-preload.ts", "./test/helpers/module-slots-preload.ts", "./test/helpers/no-prod-network.ts"]
